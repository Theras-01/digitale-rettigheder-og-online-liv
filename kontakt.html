<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
    <link rel="stylesheet" href="/css/kontakt-style.css">
    <script src="https://kit.fontawesome.com/3534c4cf73.js" crossorigin="anonymous"></script>
    <script src="/js/script.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <a href="/index.html">
                    <img class="logo" src="/img/logo-forenklet.png" alt="Logo: Skjold med flueben">
                </a>

                <button
                id="bars"
                aria-expanded="false"
                aria-controls="menu"
                aria-label="open navigation"
                >
                <i class="fa-solid fa-bars"></i>
                </button>

                <ul id="menu">
                    <li><a class="active" href="/index.html">Forside</a></li>
                    <li><a href="/kontakt.html">Kontakt</a></li>
                    <li><a href="#">Sociale medier</a></li>
                </ul>    

                <div class="menu-højre">
                    <li><a href="#"><i class="fa-solid fa-magnifying-glass"></i></a></li>
                    <li><a class="cta-knap-1" href="#">Log ind <img src="" alt=""></a></li>
                </div>
            </nav>
        </header>

        <main>
            <img src="/img/kontaktbillde.png" alt="">
            <h1>Kontakt os</h1>

            <section>
                <h2>Telefon tider</h2>

                <div class="section-tekst-billede">
                    <p>Mandag: 10:00 - 14:00
                    Tirsdag: 10:00 - 13:00
                    Onsdag: 10:00 - 14:00
                    Torsdag: 10:00 - 14:00
                    Fredag: 10:00 - 12:00  
                    Lørdag & Søndag: Lukket</p>
                    <img src="/img/logo-forenklet-kontakt.png" alt="Logo: Skjold med flueben">
                </div>
            </section>

            <h3>Eller kontakt os her</h3>
            <form>
                <label for="navn">Navn</label>
                <input id="navn" type="text">

                <label for="adresse">E-mailadresse</label>
                <input id="adresse" type="text">

                <label for="telefon">Telefon nummer</label>
                <input id="telefon" type="tel">

                <label for="mail">Emne</label>
                <input id="mail" type="email">
                
                <!--Beskedfelt-->
                <label for="besked">Din besked</label>
                <textarea name="besked" id="besked" placeholder="Skriv her..." rows="10" cols="20"></textarea>               
                
                <button type="submit">Send</button>
            </form>
        </main>

        <footer>
            <a href="/index.html">
                <img class="logo" src="/img/logo-forenklet.png" alt="Logo: Skjold med flueben">
            </a>
            <a href=""><i class="fa-brands fa-facebook"></i></a>
            <a href=""><i class="fa-brands fa-linkedin"></i></a>

            <h4>Copyright 2026</h4>
            <i class="fa-regular fa-copyright"></i>
        </footer>
    </div>
</body>
</html>
